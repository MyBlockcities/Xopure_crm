[server]
http_addr = 127.0.0.1
http_port = 3333
domain = localhost
# root_url must stay coherent with http_addr/http_port above.
# When Tailscale Serve is configured (e.g. tailscale serve --bg --https 443 http://127.0.0.1:3333),
# update domain to the Tailscale machine name and root_url to the https:// Tailscale URL.
root_url = http://localhost:3333/

[auth.anonymous]
enabled = false

[security]
disable_gravatar = true

[analytics]
reporting_enabled = false
check_for_updates = false
